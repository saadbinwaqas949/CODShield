<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CODShield demo call</title>
  <style>
    body{font:16px system-ui,sans-serif;background:#eef2f3;margin:0;color:#14202b}
    main{max-width:560px;margin:24px auto;padding:20px;background:white;border-radius:18px;box-shadow:0 3px 18px #0001}
    h1{font-size:1.3rem}.demo{font-size:.75rem;background:#fff0c2;padding:4px 8px;border-radius:10px}
    #log{min-height:170px;max-height:44vh;overflow:auto;background:#f5f7f8;padding:12px;border-radius:12px}
    .bubble{padding:10px 13px;margin:8px 0;border-radius:14px;max-width:90%;white-space:pre-wrap;overflow-wrap:anywhere}
    .assistant{background:#e4f2e8}.customer{background:#dcecff;margin-left:auto}
    form{display:flex;gap:8px;margin-top:12px}input{flex:1;min-width:0;padding:12px;border:1px solid #aab5bd;border-radius:10px}
    button{padding:12px 15px;border:0;border-radius:10px;background:#126b52;color:white;font-weight:600}
    button:disabled,input:disabled{opacity:.55}.hint{color:#52616a;font-size:.9rem}
  </style>
</head>
<body><main>
  <span class="demo">DEMO CALL</span><h1>Order confirmation</h1>
  <div id="log" aria-live="polite"></div>
  <p class="hint" id="status">Connecting…</p>
  <form id="form"><input id="text" maxlength="500" autocomplete="off" placeholder="Say or type your response" aria-label="Your response"><button id="listen" type="button">Speak</button><button id="send">Send</button></form>
  <p class="hint">Use the text box if speech is unavailable. Say “haan confirm”, “cancel”, or tell us the new address.</p>
</main>
<script>
const token=location.pathname.split('/').pop(), log=document.querySelector('#log'), form=document.querySelector('#form'), input=document.querySelector('#text'), send=document.querySelector('#send'), statusEl=document.querySelector('#status');
const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
// Use text nodes for both sides of the transcript so speech text cannot inject markup.
function bubble(text,who){const el=document.createElement('div');el.className='bubble '+who;el.dir='auto';el.textContent=text;log.append(el);log.scrollTop=log.scrollHeight;}
// Cancel any queued utterance before speaking the newest assistant response.
function speak(text){if('speechSynthesis' in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(text));}}
let finished=false;
// Load the server-owned opening prompt; an expired or invalid link disables input.
async function boot(){try{const r=await fetch('/api/calls/browser/'+encodeURIComponent(token));if(!r.ok)throw Error();const data=await r.json();bubble(data.say,'assistant');speak(data.say);statusEl.textContent='Your turn. Speak or type a response.';}catch{statusEl.textContent='This call link is invalid or has expired.';input.disabled=send.disabled=true;}}
// Send one recognized or typed response and let the server determine the call outcome.
async function submit(text){if(finished||(!text.trim()&&text!=='__silence__'))return;input.value='';if(!['__recognition_failed__','__silence__'].includes(text))bubble(text,'customer');statusEl.textContent='One moment…';send.disabled=true;try{const r=await fetch('/api/calls/browser/'+encodeURIComponent(token)+'/turn',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});const data=await r.json();if(!r.ok)throw Error();bubble(data.say,'assistant');speak(data.say);finished=data.done;statusEl.textContent=finished?'Call complete.':'Your turn. Speak or type a response.';if(finished)input.disabled=true;}catch{statusEl.textContent='Could not send that response. Please try again.';}finally{send.disabled=finished;}}
form.addEventListener('submit',e=>{e.preventDefault();submit(input.value);});
if(Recognition){const rec=new Recognition();rec.lang='ur-PK';rec.interimResults=false;rec.maxAlternatives=1;rec.onresult=e=>{const heard=e.results[0][0].transcript;if(heard)submit(heard);else submit('__silence__');};rec.onerror=e=>submit(e.error==='no-speech'?'__silence__':'__recognition_failed__');document.querySelector('#listen').addEventListener('click',()=>{try{rec.start();statusEl.textContent='Listening…';}catch{}});}else{document.querySelector('#listen').hidden=true;}
boot();
</script>
</body></html>
